# .github/workflows/docker-nodejs-template.yml

name: Reusable Node.js CI with Docker

on:
  workflow_call:
    inputs:
      docker-image-name:
        description: 'Docker Image Name'
        required: true
        type: string
    secrets: 
      docker-user: ${{secrets.DOCKER_USER}}
      docker-pass: ${{secrets.DOCKER_PASS}}
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm install

      - name: Create build
        run: npm run build

      - name: Check Directories
        run: ls -al

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.docker-user }}
          password: ${{ secrets.docker-pass }}

      - name: Build Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ inputs.docker-image-name }}
